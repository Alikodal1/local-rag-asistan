<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Yazılım Asistanı</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Sürükle ve Bırak Ekranı (Overlay) */
        #drop-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: bold;
            border: 4px dashed var(--primary);
            box-sizing: border-box;
            pointer-events: none;
        }

        #sidebar {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
        }

        #new-chat-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            margin-bottom: 25px;
        }

        #new-chat-btn:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-history-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .chat-history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .chat-history-item.active {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            border-color: rgba(59, 130, 246, 0.2);
            font-weight: 500;
        }

        /* Geçmişi Sil Butonu */
        #clear-history-btn {
            margin-top: auto;
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        #clear-history-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }

        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            position: relative;
        }

        #header {
            background: var(--bg-panel);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }

        #upload-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #upload-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        #messages {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .msg-container {
            display: flex;
            gap: 16px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-container.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user .avatar {
            background: var(--primary);
        }

        .bot .avatar {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
        }

        .msg {
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .user .msg {
            background: var(--primary);
            color: white;
            border-top-right-radius: 4px;
        }

        .bot .msg {
            background: var(--bg-panel);
            color: var(--text-main);
            border-top-left-radius: 4px;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .bot .msg pre {
            background: #0d1117;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        .bot .msg code {
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .bot .msg p {
            margin: 0 0 10px 0;
        }

        .bot .msg p:last-child {
            margin: 0;
        }

        #input-area {
            padding: 24px 40px;
            background: var(--bg-dark);
        }

        .input-wrapper {
            display: flex;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            transition: border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        #send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

<body>

    <!-- Sürükle Bırak Ekranı -->
    <div id="drop-overlay">
        Belgeyi Buraya Bırak 📄
    </div>

    <div id="sidebar">
        <button id="new-chat-btn" onclick="startNewChat()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Yeni Sohbet
        </button>
        <div id="chat-list"></div>

        <!-- Geçmişi Sil Butonu -->
        <button id="clear-history-btn" onclick="clearAllHistory()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Tüm Geçmişi Sil
        </button>
    </div>

    <div id="main-area">
        <div id="header">
            <div class="header-title">
                <span class="status-dot"></span>
                Yerel AI Asistanı <span
                    style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal; margin-left: 10px;">| RAG
                    Motoru Aktif</span>
            </div>

            <input type="file" id="file-input" style="display: none;" accept=".pdf,.txt"
                onchange="uploadDocument(event)">
            <button id="upload-btn" onclick="document.getElementById('file-input').click()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Belge Yükle
            </button>
        </div>

        <div id="messages"></div>

        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Dokümanla ilgili mühendislik sorunuzu yazın..."
                    onkeypress="handleKeyPress(event)">
                <button id="send-btn" onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({
            highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }, breaks: true
        });

        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('user-input');
        const chatListDiv = document.getElementById('chat-list');
        const dropOverlay = document.getElementById('drop-overlay');

        let chatHistory = JSON.parse(localStorage.getItem('chats')) || [];
        let currentChatId = null;

        window.onload = () => {
            renderChatList();
            if (chatHistory.length > 0) loadChat(chatHistory[0].id);
            else startNewChat();
        };

        // --- Sürükle ve Bırak (Drag & Drop) Dinleyicileri ---
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropOverlay.style.display = 'flex';
        });

        window.addEventListener('dragleave', (e) => {
            e.preventDefault();
            // Yanıp sönmeyi engellemek için kontrol
            if (e.relatedTarget === null || e.relatedTarget === document.documentElement) {
                dropOverlay.style.display = 'none';
            }
        });

        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dropOverlay.style.display = 'none';
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        function uploadDocument(event) {
            const file = event.target.files[0];
            if (file) processFile(file);
            event.target.value = ''; // Input'u sıfırla
        }

        async function processFile(file) {
            if (!file.name.toLowerCase().endsWith('.pdf') && !file.name.toLowerCase().endsWith('.txt')) {
                alert('Sadece PDF veya TXT dosyaları yüklenebilir.');
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            const loadingMsg = appendMessage(`🔄 ${file.name} vektör veritabanına işleniyor...`, 'bot');

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const result = await response.json();

                if (response.ok) {
                    loadingMsg.innerHTML = marked.parse(`✅ **Sistem Güncellendi:** ${result.message}`);
                    saveMessageToHistory('bot', `✅ **Sistem Güncellendi:** ${result.message}`);
                } else {
                    loadingMsg.innerHTML = marked.parse(`❌ **Hata:** ${result.error}`);
                }
            } catch (error) {
                loadingMsg.innerHTML = "❌ Sunucuya bağlanırken hata oluştu.";
            }
        }

        function clearAllHistory() {
            if (confirm("Tüm sohbet geçmişini silmek istediğinize emin misiniz?")) {
                localStorage.removeItem('chats');
                chatHistory = [];
                startNewChat();
            }
        }

        function appendMessage(text, role, isStreaming = false) {
            let container = document.createElement('div');
            container.className = `msg-container ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = role === 'user' ? '👤' : '🤖';

            const msgElement = document.createElement('div');
            msgElement.className = 'msg';

            if (role === 'bot' && !isStreaming) {
                msgElement.innerHTML = marked.parse(text);
            } else {
                msgElement.innerHTML = text.replace(/\n/g, '<br>');
            }

            container.appendChild(avatar);
            container.appendChild(msgElement);
            messagesDiv.appendChild(container);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return msgElement;
        }

        function startNewChat() {
            currentChatId = null;
            messagesDiv.innerHTML = '';
            appendMessage('Merhaba! Sağ üstteki butonu kullanarak veya **PDF belgesini doğrudan bu ekrana sürükleyerek** sisteme teknik doküman yükleyebilirsiniz.', 'bot');
            renderChatList();
        }

        function loadChat(id) {
            currentChatId = id;
            messagesDiv.innerHTML = '';
            const chat = chatHistory.find(c => c.id === id);
            chat.messages.forEach(msg => appendMessage(msg.text, msg.role));
            renderChatList();
        }

        function renderChatList() {
            chatListDiv.innerHTML = '';
            [...chatHistory].reverse().forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerText = chat.title;
                item.onclick = () => loadChat(chat.id);
                chatListDiv.appendChild(item);
            });
        }

        function saveMessageToHistory(role, text) {
            if (!currentChatId) {
                currentChatId = Date.now().toString();
                const title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                chatHistory.push({ id: currentChatId, title: title, messages: [] });
            }
            const chatIndex = chatHistory.findIndex(c => c.id === currentChatId);
            chatHistory[chatIndex].messages.push({ role: role, text: text });
            localStorage.setItem('chats', JSON.stringify(chatHistory));
            renderChatList();
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';
            saveMessageToHistory('user', text);

            const loadingMsg = appendMessage('Düşünüyor...', 'bot', true);
            let fullBotResponse = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                loadingMsg.innerHTML = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunkText = decoder.decode(value);
                    fullBotResponse += chunkText;
                    loadingMsg.innerHTML = fullBotResponse.replace(/\n/g, '<br>');
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
                loadingMsg.innerHTML = marked.parse(fullBotResponse);
                saveMessageToHistory('bot', fullBotResponse);
            } catch (error) {
                loadingMsg.innerHTML = "Sunucuya bağlanırken bir hata oluştu.";
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>

</html>
